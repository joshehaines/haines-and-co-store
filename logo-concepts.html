<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haines & Co. — Concept 02 Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100;200;300;400;500;600;700;800;900&family=Big+Shoulders+Text:wght@100;300;400;700;900&family=Inter:wght@100;200;300;400;500;700;900&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; font-family:'Inter',sans-serif; padding:48px 28px; }

  .page-title {
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:200;
    font-size:0.62rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:#333;
    margin-bottom:44px;
  }

  .grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
    max-width:1000px;
    margin:0 auto;
  }
  .grid-3 {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:3px;
    max-width:1000px;
    margin:0 auto 3px;
  }

  .tile {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 32px 36px;
    min-height:210px;
    position:relative;
  }
  .tile.tall { min-height:260px; }

  .num {
    position:absolute;
    top:14px;
    left:18px;
    font-size:0.52rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-weight:400;
  }
  .light { color:rgba(255,255,255,0.18); }
  .dark-num { color:rgba(0,0,0,0.18); }

  /* backgrounds */
  .bg-navy    { background:#1a3a72; }
  .bg-ink     { background:#060e1c; }
  .bg-black   { background:#080808; }
  .bg-white   { background:#ffffff; }
  .bg-cream   { background:#f5f0e8; }
  .bg-mid     { background:#141e2e; }
  .bg-slate   { background:#1a2535; }
  .bg-gold    { background:#9a7d4e; }
  .bg-offwhite { background:#f9f6f1; }

  /* ── 01: Inline, huge, gold amp ── */
  .v01 { display:flex; align-items:baseline; gap:8px; }
  .v01 .w { font-family:'Big Shoulders Display',sans-serif; font-size:5.8rem; font-weight:900; color:#faf8f5; letter-spacing:0.01em; line-height:1; }
  .v01 .a { font-family:'Big Shoulders Display',sans-serif; font-size:3rem; font-weight:300; color:#c9a96e; line-height:1; }
  .v01 .c { font-family:'Big Shoulders Display',sans-serif; font-size:3.8rem; font-weight:700; color:#faf8f5; opacity:0.35; }

  /* ── 02: Stacked, rule between ── */
  .v02 { display:flex; flex-direction:column; align-items:flex-start; gap:0; }
  .v02 .w { font-family:'Big Shoulders Display',sans-serif; font-size:5rem; font-weight:900; color:#faf8f5; letter-spacing:0.02em; line-height:1; }
  .v02 hr  { width:100%; border:none; border-top:2px solid #c9a96e; margin:8px 0; }
  .v02 .bot { display:flex; align-items:baseline; gap:8px; }
  .v02 .a { font-family:'Big Shoulders Display',sans-serif; font-size:2rem; font-weight:300; color:#c9a96e; }
  .v02 .c { font-family:'Big Shoulders Display',sans-serif; font-size:2.5rem; font-weight:700; color:#faf8f5; opacity:0.45; letter-spacing:0.08em; }

  /* ── 03: Outlined / ghost text ── */
  .v03 { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .v03 .w {
    font-family:'Big Shoulders Display',sans-serif;
    font-size:5.4rem; font-weight:900;
    letter-spacing:0.04em;
    -webkit-text-stroke:2px #faf8f5;
    color:transparent;
    line-height:1;
  }
  .v03 .sub {
    font-family:'Inter',sans-serif;
    font-size:0.62rem;
    font-weight:200;
    letter-spacing:0.6em;
    text-transform:uppercase;
    color:#c9a96e;
    padding-right:0.6em;
  }

  /* ── 04: Cream bg, navy heavy ── */
  .v04 { display:flex; align-items:baseline; gap:6px; }
  .v04 .w { font-family:'Big Shoulders Display',sans-serif; font-size:5.4rem; font-weight:900; color:#1a3a72; letter-spacing:0.01em; line-height:1; }
  .v04 .a { font-family:'Big Shoulders Display',sans-serif; font-size:2.8rem; font-weight:200; color:#9a7d4e; font-style:italic; }
  .v04 .c { font-family:'Big Shoulders Display',sans-serif; font-size:3.5rem; font-weight:600; color:#1a3a72; opacity:0.3; }

  /* ── 05: All caps, spaced, gold bg ── */
  .v05 { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .v05 .w { font-family:'Big Shoulders Display',sans-serif; font-size:3.5rem; font-weight:900; color:#1a3a72; letter-spacing:0.18em; line-height:1; }
  .v05 .rule { width:100%; height:1.5px; background:#1a3a72; opacity:0.3; }
  .v05 .sub { font-family:'Big Shoulders Display',sans-serif; font-size:1.1rem; font-weight:300; color:#1a3a72; letter-spacing:0.5em; padding-right:0.5em; }

  /* ── 06: Very large, name only, white ── */
  .v06 { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .v06 .w { font-family:'Big Shoulders Display',sans-serif; font-size:6.5rem; font-weight:900; color:#ffffff; letter-spacing:0.02em; line-height:0.92; }
  .v06 .sub { display:flex; align-items:center; gap:10px; width:100%; justify-content:flex-end; }
  .v06 .line { flex:1; height:1px; background:#c9a96e; opacity:0.5; }
  .v06 .co-text { font-family:'Inter',sans-serif; font-weight:100; font-size:0.65rem; letter-spacing:0.4em; color:#c9a96e; text-transform:uppercase; }

  /* ── 07: Split weight — thin + black ── */
  .v07 { display:flex; align-items:baseline; gap:0; }
  .v07 .thin { font-family:'Big Shoulders Display',sans-serif; font-size:5rem; font-weight:100; color:#faf8f5; letter-spacing:0.05em; opacity:0.4; }
  .v07 .bold { font-family:'Big Shoulders Display',sans-serif; font-size:5rem; font-weight:900; color:#faf8f5; letter-spacing:0.01em; }
  .v07 .amp  { font-family:'Big Shoulders Display',sans-serif; font-size:2.2rem; font-weight:200; color:#c9a96e; margin-left:8px; }
  .v07 .co   { font-family:'Big Shoulders Display',sans-serif; font-size:2.6rem; font-weight:700; color:#c9a96e; opacity:0.6; }

  /* ── 08: Narrow stacked, badge style ── */
  .v08 { display:flex; flex-direction:column; align-items:center; gap:0; padding:20px 28px; border:2px solid #c9a96e; }
  .v08 .tag-top { font-family:'Inter',sans-serif; font-weight:200; font-size:0.52rem; letter-spacing:0.5em; color:#c9a96e; text-transform:uppercase; padding:6px 0; }
  .v08 hr { width:100%; border:none; border-top:1px solid rgba(201,169,110,0.35); }
  .v08 .w { font-family:'Big Shoulders Display',sans-serif; font-size:4rem; font-weight:900; color:#faf8f5; letter-spacing:0.06em; line-height:1.1; }
  .v08 .tag-bot { font-family:'Big Shoulders Display',sans-serif; font-weight:300; font-size:1.1rem; color:#c9a96e; letter-spacing:0.4em; padding:4px 0 6px; }

  /* ── 09: Massive italic condensed ── */
  .v09 { display:flex; align-items:flex-end; gap:10px; }
  .v09 .w {
    font-family:'Big Shoulders Display',sans-serif;
    font-size:6rem; font-weight:900;
    color:#faf8f5;
    font-style:italic;
    letter-spacing:0.02em;
    line-height:1;
  }
  .v09 .right { display:flex; flex-direction:column; align-items:flex-start; padding-bottom:10px; gap:2px; }
  .v09 .a { font-family:'Big Shoulders Display',sans-serif; font-size:1.6rem; font-weight:200; color:#c9a96e; font-style:italic; }
  .v09 .dot-line { display:flex; gap:4px; align-items:center; }
  .v09 .dot-line span { width:4px; height:4px; border-radius:50%; background:#c9a96e; opacity:0.5; display:block; }

</style>
</head>
<body>

<p class="page-title">Haines &amp; Co. — Concept 02 Variations · Big Shoulders Display</p>

<div class="grid" style="margin-bottom:3px">

  <!-- V01 -->
  <div class="tile bg-navy">
    <span class="num light">01</span>
    <div class="v01">
      <span class="w">HAINES</span>
      <span class="a">&amp;</span>
      <span class="c">CO.</span>
    </div>
  </div>

  <!-- V02 -->
  <div class="tile bg-ink">
    <span class="num light">02</span>
    <div class="v02">
      <div class="w">HAINES</div>
      <hr>
      <div class="bot">
        <span class="a">&amp;</span>
        <span class="c">CO.</span>
      </div>
    </div>
  </div>

  <!-- V03 -->
  <div class="tile bg-black">
    <span class="num light">03</span>
    <div class="v03">
      <div class="w">HAINES</div>
      <div class="sub">&amp; &nbsp; Co.</div>
    </div>
  </div>

  <!-- V04 -->
  <div class="tile bg-cream">
    <span class="num dark-num">04</span>
    <div class="v04">
      <span class="w">HAINES</span>
      <span class="a">&amp;</span>
      <span class="c">CO.</span>
    </div>
  </div>

</div>

<div class="grid" style="margin-bottom:3px">

  <!-- V05 -->
  <div class="tile bg-gold">
    <span class="num dark-num">05</span>
    <div class="v05">
      <div class="w">HAINES</div>
      <div class="rule"></div>
      <div class="sub">&amp; &nbsp; CO.</div>
    </div>
  </div>

  <!-- V06 -->
  <div class="tile bg-mid tall">
    <span class="num light">06</span>
    <div class="v06">
      <div class="w">HAINES</div>
      <div class="sub">
        <div class="line"></div>
        <span class="co-text">&amp; Co.</span>
      </div>
    </div>
  </div>

  <!-- V07 -->
  <div class="tile bg-slate">
    <span class="num light">07</span>
    <div class="v07">
      <span class="thin">H</span><span class="bold">AINES</span>
      <span class="amp">&amp;</span>
      <span class="co">CO.</span>
    </div>
  </div>

  <!-- V08 -->
  <div class="tile bg-ink">
    <span class="num light">08</span>
    <div class="v08">
      <div class="tag-top">Est. 2025</div>
      <hr>
      <div class="w">HAINES</div>
      <div class="tag-bot">&amp; Co.</div>
      <hr>
    </div>
  </div>

</div>

<div class="grid">

  <!-- V09 -->
  <div class="tile bg-navy tall">
    <span class="num light">09</span>
    <div class="v09">
      <div class="w">HAINES</div>
      <div class="right">
        <div class="a">&amp; Co.</div>
        <div class="dot-line">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- V10: White bg version of 09 -->
  <div class="tile bg-offwhite tall">
    <span class="num dark-num">10</span>
    <div style="display:flex; align-items:baseline; gap:6px;">
      <span style="font-family:'Big Shoulders Display',sans-serif; font-size:6rem; font-weight:900; font-style:italic; color:#1a3a72; letter-spacing:0.02em; line-height:1;">HAINES</span>
      <div style="display:flex;flex-direction:column;align-items:flex-start;padding-bottom:12px;gap:0">
        <span style="font-family:'Big Shoulders Display',sans-serif;font-size:1.8rem;font-weight:200;color:#9a7d4e;font-style:italic;">&amp;</span>
        <span style="font-family:'Big Shoulders Display',sans-serif;font-size:2.2rem;font-weight:700;color:#1a3a72;opacity:0.3;font-style:italic;">CO.</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
